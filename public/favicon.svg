<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe088" />
      <stop offset="50%" stop-color="#f2ca50" />
      <stop offset="100%" stop-color="#d4af37" />
    </linearGradient>
    <linearGradient id="dark-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1b" />
      <stop offset="100%" stop-color="#131313" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Container with Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#dark-bg)" stroke="url(#gold-bg)" stroke-width="16" />

  <!-- Center Gold Badge -->
  <rect x="84" y="84" width="344" height="344" rx="76" fill="url(#gold-bg)" filter="url(#gold-glow)" />

  <!-- Main Four-Point Sparkle Icon -->
  <path d="M256 136 L276 226 L366 246 L380 256 L366 266 L276 286 L256 376 L236 286 L146 266 L132 256 L146 246 L236 226 Z" fill="#131313" />
  
  <!-- Secondary Top-Right Sparkle -->
  <path d="M352 144 L360 174 L390 182 L360 190 L352 220 L344 190 L314 182 L344 174 Z" fill="#131313" opacity="0.9" />
  
  <!-- Secondary Bottom-Left Sparkle -->
  <path d="M164 324 L170 346 L192 352 L170 358 L164 380 L158 358 L136 352 L158 346 Z" fill="#131313" opacity="0.85" />
</svg>
